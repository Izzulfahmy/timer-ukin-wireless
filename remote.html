<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Control UKIN</title>
    <!-- Library QR Generator & Camera Scanner -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; margin:0; padding:0; }
        body { font-family: sans-serif; background:#111; color:#fff; padding:16px; text-align:center; }
        h2 { margin-bottom: 12px; font-size: 1.2rem; }
        textarea { width: 100%; height: 70px; background:#222; color:#fff; border: 1px solid #444; border-radius:6px; padding:8px; font-size:0.75rem; margin-bottom:10px; }
        .btn-action { padding: 14px; font-size: 1rem; font-weight: bold; border-radius: 8px; border: none; background: #333; color: #fff; cursor: pointer; }
        .btn-action:active { background: #555; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn-main { grid-column: span 2; background: #007bff; font-size: 1.3rem; padding: 20px; }
        .btn-reset { background: #dc3545; }
        .status { margin-bottom: 10px; font-weight: bold; font-size: 0.9rem; color: #ff4444; }
        .status.connected { color: #28a745; }
        #reader { width: 100%; margin-bottom: 10px; border-radius: 8px; overflow: hidden; background:#000; }
        #qrOutputContainer { display: flex; justify-content: center; margin-top: 10px; background:#fff; padding:10px; border-radius:8px; }
        .error-msg { background: #721c24; color: #f8d7da; padding: 8px; border-radius: 6px; font-size: 0.8rem; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>
    <h2>REMOTE TIMER UKIN</h2>
    <div class="status" id="remoteStatus">OFFLINE</div>

    <div id="setupBox">
        <button class="btn-action" id="btnScan" style="width:100%; background:#28a745; margin-bottom:10px;" onclick="startScanner()">📷 SCAN QR LAPTOP</button>
        <div class="error-msg" id="camError"></div>
        <div id="reader"></div>

        <textarea id="remoteOfferInput" placeholder="Atau Tempel Kode Offer Laptop di sini..."></textarea>
        <button class="btn-action" style="width:100%; background:#007bff;" onclick="generateAnswer()">Buat Jawaban (Answer)</button>
        
        <div id="qrOutputContainer" style="display:none;"></div>
        <textarea id="remoteAnswerOutput" readonly placeholder="Salin kode ini dan tempel ke laptop..." style="margin-top:10px; display:none;"></textarea>
    </div>

    <div class="grid" id="controlsBox" style="display:none;">
        <button class="btn-action btn-main" onclick="sendCmd('TOGGLE')">PLAY / PAUSE</button>
        <button class="btn-action" onclick="sendCmd('-10')">-10s</button>
        <button class="btn-action" onclick="sendCmd('+10')">+10s</button>
        <button class="btn-action" onclick="sendCmd('-5')">-5s</button>
        <button class="btn-action" onclick="sendCmd('+5')">+5s</button>
        <button class="btn-action" onclick="sendCmd('PREV')">‹ Sintaks Lalu</button>
        <button class="btn-action" onclick="sendCmd('NEXT')">Sintaks Next ›</button>
        <button class="btn-action btn-reset" style="grid-column: span 2;" onclick="sendCmd('RESET')">RESET</button>
    </div>

    <script>
        let remotePeer, remoteChannel, html5QrCode;

        function compressSDP(sdp) {
            return sdp.sdp.split('\r\n')
                .filter(line => !line.startsWith('a=extmap') && !line.startsWith('a=rtcp'))
                .join('\n');
        }

        function decompressSDP(compact, type) {
            return { type: type, sdp: compact.split('\n').join('\r\n') };
        }

        function startScanner() {
            const errBox = document.getElementById('camError');
            errBox.style.display = 'none';

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 15, qrbox: { width: 230, height: 230 } },
                (decodedText) => {
                    document.getElementById('remoteOfferInput').value = decodedText;
                    html5QrCode.stop();
                    document.getElementById('reader').style.display = 'none';
                    generateAnswer();
                },
                (errorMessage) => {}
            ).catch(err => {
                errBox.style.display = 'block';
                errBox.innerHTML = 'Kamera gagal diakses. Pastikan halaman diakses via HTTPS (GitHub Pages) dan izin kamera aktif.';
            });
        }

        function generateAnswer() {
            const offerStr = document.getElementById('remoteOfferInput').value;
            if(!offerStr) return;

            remotePeer = new RTCPeerConnection();

            remotePeer.ondatachannel = (e) => {
                remoteChannel = e.channel;
                remoteChannel.onopen = () => {
                    document.getElementById('remoteStatus').textContent = 'TERHUBUNG (READY)';
                    document.getElementById('remoteStatus').className = 'status connected';
                    document.getElementById('setupBox').style.display = 'none';
                    document.getElementById('controlsBox').style.display = 'grid';
                };
            };

            remotePeer.onicecandidate = (e) => {
                if(!e.candidate) {
                    const compactAns = compressSDP(remotePeer.localDescription);
                    document.getElementById('remoteAnswerOutput').value = compactAns;
                    document.getElementById('remoteAnswerOutput').style.display = 'block';
                    
                    const qrBox = document.getElementById('qrOutputContainer');
                    qrBox.style.display = 'flex';
                    qrBox.innerHTML = '';
                    new QRCode(qrBox, {
                        text: compactAns,
                        width: 200,
                        height: 200,
                        correctLevel: QRCode.CorrectLevel.L
                    });
                }
            };

            try {
                const fullOffer = decompressSDP(offerStr.trim(), 'offer');
                remotePeer.setRemoteDescription(fullOffer)
                    .then(() => remotePeer.createAnswer())
                    .then(a => remotePeer.setLocalDescription(a));
            } catch(e) {
                alert('Kode Offer tidak valid!');
            }
        }

        function sendCmd(cmd) {
            if(remoteChannel && remoteChannel.readyState === 'open') {
                remoteChannel.send(cmd);
            }
        }
    </script>
</body>
</html>
